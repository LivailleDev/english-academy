services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: english_academy
      MYSQL_USER: english_academy
      MYSQL_PASSWORD: english_academy
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
