# Fly.io app config for the Spring Boot API.
# `app` must be globally unique across all of Fly — pick your own name
# during `fly launch` / `fly apps create` and update it here.
app = "english-academy-api"
primary_region = "mad"

[build]

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
